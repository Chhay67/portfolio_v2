<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Base Href -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="A modern and responsive portfolio website showcasing web and mobile development skills, real-world projects, and clean UI/UX design.">

  <!-- iOS Meta Tags & App Icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="portfolio_v2">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Chhay Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <!-- ✅ Static theme-color for browsers that parse it before JS runs -->
  <meta name="theme-color" content="#F2F5F9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1011" media="(prefers-color-scheme: dark)">

  <!-- ✅ Inline splash screen styles -->
  <style id="splash-screen-style">
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F2F5F9;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0f1011;
      }
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .contain, .stretch, .cover {
      display: block;
      width: 100%;
      height: 100%;
    }

    .contain {
      object-fit: contain;
    }

    .cover {
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>

  <!-- ✅ Early runtime theme-color correction -->
  <script>
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    const themeColorMeta = document.createElement("meta");
    themeColorMeta.name = "theme-color";
    themeColorMeta.content = isDark ? "#0f1011" : "#F2F5F9";
    document.head.appendChild(themeColorMeta);

    const iosStatusBar = document.createElement("meta");
    iosStatusBar.name = "apple-mobile-web-app-status-bar-style";
    iosStatusBar.content = isDark ? "black-translucent" : "default";
    document.head.appendChild(iosStatusBar);

    document.body.style.backgroundColor = isDark ? "#0f1011" : "#F2F5F9";
  </script>

  <!-- ✅ Viewport meta tag -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>

<body>
<!-- ✅ Splash screen using light/dark variants -->
<picture id="splash">
  <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
  <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
  <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="Loading...">
</picture>

<!-- ✅ Optional branding removal -->
<script id="splash-screen-script">
  function removeSplashFromWeb() {
    document.getElementById("splash")?.remove();
    document.getElementById("splash-branding")?.remove();
    document.body.style.background = "transparent";
  }
</script>

<!-- ✅ Flutter app bootstrapping -->
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
